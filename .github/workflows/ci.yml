name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, intl, gd, zip, pdo_mysql
          coverage: none

      - name: Validate composer files
        run: composer validate --strict

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Lint container
        run: bin/console lint:container

      - name: Lint Twig
        run: bin/console lint:twig templates

      - name: Lint YAML
        run: bin/console lint:yaml config

      # The same compose file developers use, so CI and local development share
      # one database definition — including the unprivileged application user
      # and the grant on the _test database.
      - name: Start database
        run: docker compose up -d --wait --wait-timeout 120

      - name: Create test schema
        run: bin/console doctrine:schema:create --env=test

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Database logs on failure
        if: failure()
        run: docker compose logs database

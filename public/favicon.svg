<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HandwerkCloud">
  <title>HandwerkCloud</title>
  <defs>
    <linearGradient id="hwc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e73df"/>
      <stop offset="1" stop-color="#224abe"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#hwc-bg)"/>

  <!-- cloud -->
  <g fill="#ffffff">
    <circle cx="25" cy="28" r="8"/>
    <circle cx="37" cy="25" r="10.5"/>
    <circle cx="44" cy="32" r="7"/>
    <rect x="19" y="30" width="27" height="9" rx="4.5"/>
  </g>

  <!-- gear: the "Handwerk" half of the mark -->
  <g transform="translate(36,28)" fill="#224abe">
    <g>
      <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1"/>
      <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(45)"/>
      <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(90)"/>
      <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(135)"/>
      <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(180)"/>
      <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(225)"/>
      <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(270)"/>
      <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(315)"/>
    </g>
    <circle r="6.4"/>
    <circle r="2.6" fill="#ffffff"/>
  </g>
</svg>

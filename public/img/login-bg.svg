<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="HandwerkCloud">
  <defs>
    <linearGradient id="hwc-login-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4e73df"/>
      <stop offset="1" stop-color="#1c3fa0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#hwc-login-bg)"/>

  <!-- soft depth -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="90" cy="120" r="180"/>
    <circle cx="540" cy="690" r="220"/>
  </g>

  <!-- mark -->
  <g transform="translate(300,360) scale(3.6) translate(-32,-32)">
    <g fill="#ffffff">
      <circle cx="25" cy="28" r="8"/>
      <circle cx="37" cy="25" r="10.5"/>
      <circle cx="44" cy="32" r="7"/>
      <rect x="19" y="30" width="27" height="9" rx="4.5"/>
    </g>
    <g transform="translate(36,28)" fill="#2a52c9">
      <g>
        <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1"/>
        <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(45)"/>
        <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(90)"/>
        <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(135)"/>
        <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(180)"/>
        <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(225)"/>
        <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(270)"/>
        <rect x="-1.6" y="-9.4" width="3.2" height="4.2" rx="1.1" transform="rotate(315)"/>
      </g>
      <circle r="6.4"/>
      <circle r="2.6" fill="#ffffff"/>
    </g>
  </g>

  <text x="300" y="530" text-anchor="middle" fill="#ffffff"
        font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="1">HandwerkCloud</text>
  <text x="300" y="566" text-anchor="middle" fill="#ffffff" opacity="0.72"
        font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" letter-spacing="3">AUFTRAGSVERWALTUNG</text>
</svg>
